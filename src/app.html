<title>Yankı 21</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EEF0EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: bir cep defteri gibi tek sütun; geniş ekranda solda dikey menü. İmza öğesi: 21 noktalı "yörünge" ve -2..+2 his ölçeği. */
:root{
  --bg:#EEF0EA; --surface:#FBFBF8; --surface-2:#E3E6DE; --ink:#18202C; --muted:#5A6371; --line:#D2D6CB;
  --accent:#27406E; --accent-ink:#FFFFFF; --accent-soft:#DCE3F0;
  --pos:#C08214; --pos-ink:#7E5205; --pos-soft:#F3E4C4;
  --neg:#6E4BA8; --neg-ink:#523483; --neg-soft:#E5DCF2;
  --good:#2E7D4F; --good-ink:#1F5E39; --good-soft:#E2F1E7; --bad:#B8453D; --bad-ink:#93302A; --bad-soft:#F8E3E0;
  --shadow:0 1px 2px rgb(24 32 44 / .05), 0 10px 30px rgb(24 32 44 / .07);
  --f-display:'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:20px; --r-sm:12px;
  --tabh:68px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131A; --surface:#181D27; --surface-2:#212736; --ink:#ECEEF2; --muted:#9AA2B1; --line:#2B3242;
  --accent:#A9BCF0; --accent-ink:#0E1424; --accent-soft:#25304A;
  --pos:#EDB04B; --pos-ink:#F4C977; --pos-soft:#382C14;
  --neg:#B092E8; --neg-ink:#CBB6F3; --neg-soft:#2A2240;
  --good:#6CC08D; --good-ink:#8FD3A8; --good-soft:#1C3125; --bad:#E8837A; --bad-ink:#F0A39C; --bad-soft:#3A2220;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10131A; --surface:#181D27; --surface-2:#212736; --ink:#ECEEF2; --muted:#9AA2B1; --line:#2B3242;
  --accent:#A9BCF0; --accent-ink:#0E1424; --accent-soft:#25304A;
  --pos:#EDB04B; --pos-ink:#F4C977; --pos-soft:#382C14;
  --neg:#B092E8; --neg-ink:#CBB6F3; --neg-soft:#2A2240;
  --good:#6CC08D; --good-ink:#8FD3A8; --good-soft:#1C3125; --bad:#E8837A; --bad-ink:#F0A39C; --bad-soft:#3A2220;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.display{font-family:var(--f-display);font-weight:400;letter-spacing:-.005em}
.eyebrow,.label{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.app{min-height:100%}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .brand{display:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tabh);text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ti{background:var(--accent-soft)}
.ti{display:grid;place-items:center;width:52px;height:30px;border-radius:99px;transition:background .2s}
main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(var(--tabh) + 96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px;outline:none}
.fab{position:fixed;z-index:21;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:8px;height:54px;padding:0 20px 0 16px;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);
  font-weight:700;font-size:15px;box-shadow:0 8px 24px rgb(20 30 60 / .25)}
.fab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:232px 1fr}
  .tabs{position:sticky;top:0;bottom:auto;height:100vh;display:flex;flex-direction:column;gap:4px;padding:28px 16px;border-top:0;border-right:1px solid var(--line);backdrop-filter:none;background:var(--surface)}
  .tabs .brand{display:block;padding:0 12px 22px}
  .tab{flex-direction:row;justify-content:flex-start;height:46px;padding:0 6px;font-size:14.5px;gap:10px;border-radius:12px}
  .tab:hover{background:var(--surface-2)}
  .ti{width:34px;height:34px}
  main{padding-block:40px 120px;width:100%}
  .fab{bottom:28px;right:32px}
}
.brand .mark{font-family:var(--f-display);font-size:34px;line-height:1}
.brand .mark i{color:var(--pos)}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:4px}

/* ---------- common ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h3{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.15}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--neg-ink);border-color:var(--neg)}
.btn.small{min-height:36px;padding:0 14px;font-size:13.5px}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:700;font-size:14px}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r-sm);background:var(--accent-soft);font-size:13.5px}
.banner b{font-weight:700}

/* ---------- today ---------- */
.greet{display:flex;flex-direction:column;gap:4px}
.greet h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,7vw,46px);line-height:1.05}
.hero{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center;padding:22px}
.hero h2{font-size:clamp(32px,6vw,42px);line-height:1.05;margin:4px 0 10px}
.hero .lead{color:var(--muted);font-size:15.5px;max-width:52ch}
.orbit svg{width:100%;height:auto;display:block}
@media (max-width:620px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.orbit{width:190px}.hero .lead{margin-inline:auto}}
.o-track{fill:none;stroke:var(--line);stroke-width:1}
.o-dot{fill:var(--surface-2);stroke:var(--line)}
.o-dot.past{fill:var(--surface);stroke:var(--muted)}
.o-dot.done{fill:var(--accent);stroke:var(--accent)}
.o-dot.now{fill:var(--pos);stroke:var(--pos)}
.o-halo{fill:none;stroke:var(--pos);stroke-width:1.5;opacity:.5;transform-origin:center;transform-box:fill-box;animation:halo 2.6s ease-out infinite}
@keyframes halo{from{transform:scale(1);opacity:.6}to{transform:scale(2.1);opacity:0}}
.o-num{font-family:var(--f-display);font-size:72px;fill:var(--ink)}
.o-sub{font-size:12px;font-weight:700;letter-spacing:.12em;fill:var(--muted)}
.task p:last-child{font-size:15.5px}
.today-energy{gap:12px}
.meter{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--neg),var(--surface-2) 50%,var(--pos))}
.meter i{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transition:left .5s}
.meter-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.big-num{font-family:var(--f-display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.mirror .q{font-size:clamp(24px,4.6vw,30px);line-height:1.2}
textarea,input[type=text],input[type=date]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:12px 14px;font-size:15.5px;line-height:1.5}
textarea{resize:vertical;min-height:96px}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.done-mark{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:13.5px}

/* ---------- log cards ---------- */
.logs{display:flex;flex-direction:column;gap:10px}
.log{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s,transform .15s;min-width:0}
.log:hover{border-color:var(--muted)}
.log:active{transform:scale(.995)}
.log-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.tag{font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.who{font-weight:600}
.time{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.quote{margin:0;font-family:var(--f-display);font-size:23px;line-height:1.25;overflow-wrap:anywhere}
.chips-sm{display:flex;flex-wrap:wrap;gap:6px}
.chip-sm{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.epill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;font-variant-numeric:tabular-nums;white-space:nowrap}
.e-pos{background:var(--pos-soft);color:var(--pos-ink)}
.e-neg{background:var(--neg-soft);color:var(--neg-ink)}
.e-neu{background:var(--surface-2);color:var(--muted)}
.log .resp{font-size:13.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty .display{font-size:24px;color:var(--ink)}

/* ---------- journey ---------- */
.page-title{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,7vw,48px);line-height:1.02}
.page-intro{color:var(--muted);max-width:60ch;margin-top:6px}
.week{display:flex;flex-direction:column;gap:12px}
.week-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.week-head h3{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1}
.week-head .wprog{font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-height:108px}
.day .dn{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.day .dt{font-weight:600;font-size:13.5px;line-height:1.3}
.day .ds{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.day.done .ds{color:var(--accent)}
.day.now{border-color:var(--pos);box-shadow:0 0 0 1px var(--pos) inset}
.day.now .ds{color:var(--pos-ink)}
.day.locked{background:transparent;color:var(--muted);border-style:dashed}
.day.locked .ds{color:var(--muted)}

/* ---------- insights ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .v{font-family:var(--f-display);font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.insight-line{font-family:var(--f-display);font-size:clamp(22px,4.4vw,27px);line-height:1.25}
.insight-line .p{color:var(--pos-ink)} .insight-line .n{color:var(--neg-ink)}
.env-rows{display:flex;flex-direction:column;gap:16px}
.env-row{display:grid;grid-template-columns:110px 1fr 54px;gap:12px;align-items:center}
@media (max-width:480px){.env-row{grid-template-columns:86px 1fr 46px}}
.env-row .el{font-weight:600;font-size:14px;line-height:1.2}
.env-row .el small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.div-track{position:relative;height:26px;border-radius:8px;background:var(--surface-2)}
.div-track::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--muted)}
.div-bar{position:absolute;top:4px;bottom:4px;border-radius:5px}
.div-bar.pos{left:50%;background:var(--pos)}
.div-bar.neg{right:50%;background:var(--neg)}
.env-row .ev{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
.split{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin-top:6px;grid-column:2/3}
.split i{display:block;height:100%}
.split .sp{background:var(--pos)} .split .sn{background:var(--neg)} .split .s0{background:var(--line)}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.flow{overflow-x:auto}
.flow-in{display:grid;grid-template-columns:repeat(21,minmax(0,1fr));gap:3px;height:150px;position:relative}
.flow-in::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.fcol{position:relative;border-radius:4px}
.fcol.cur{background:color-mix(in srgb,var(--pos) 10%,transparent)}
.fcol i{position:absolute;left:15%;right:15%;border-radius:3px}
.fcol i.p{bottom:50%;background:var(--pos)}
.fcol i.n{top:50%;background:var(--neg)}
.flow-x{display:grid;grid-template-columns:repeat(21,minmax(0,1fr));gap:3px;font-size:10px;color:var(--muted);text-align:center;margin-top:6px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,170px) 1fr 30px;gap:10px;align-items:center;font-size:13.5px}
.hbar .t{min-width:0;overflow-wrap:anywhere;font-weight:600}
.hbar .b{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbar .b i{display:block;height:100%;border-radius:99px}
.hbar .c{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.people{display:flex;flex-direction:column}
.person{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.person .nm{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.person .nm small{display:block;color:var(--muted);font-weight:500;font-size:12px}

/* ---------- rehber ---------- */
.g-steps{display:flex;gap:8px;flex-wrap:wrap}
.g-step{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13.5px}
.g-step b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px}
.g-sec{display:flex;flex-direction:column;gap:14px}
.g-sec > h2{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5.5vw,36px);line-height:1.1}
.g-sec > p{color:var(--muted);max-width:62ch}
.g-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.g-pair{grid-template-columns:1fr}}
.g-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.g-card h3{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.g-card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.g-q{margin:0;font-family:var(--f-display);font-size:19px;line-height:1.3;padding:10px 12px;border-radius:var(--r-sm);background:var(--bg)}
.g-tag{font-family:var(--f-body);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.g-sub{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.g-scale{display:flex;flex-direction:column;gap:8px}
.g-row{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.g-num{display:grid;place-items:center;height:56px;border-radius:12px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;color:var(--ink)}
.g-row h4{margin:0 0 2px;font-size:15.5px}
.g-row p{margin:0;font-size:14px;color:var(--muted)}
.g-row .g-words{margin-top:6px;font-size:13px;color:var(--ink)}
.g-example{display:flex;flex-direction:column;gap:10px}
.g-ex-row{display:grid;grid-template-columns:120px 1fr;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.g-ex-row:last-child{border-bottom:0}
.g-ex-row span:first-child{color:var(--muted);font-weight:600}
@media (max-width:480px){.g-ex-row{grid-template-columns:1fr;gap:2px}}
.guide-link{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);text-decoration:none}
.guide-link b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px}
.guide-link span{font-size:13.5px;color:var(--muted)}
.guide-link svg{width:22px;height:22px;flex:none;stroke:var(--accent);stroke-width:2;fill:none}
.type-grid{display:grid;grid-template-columns:auto auto auto;gap:12px;justify-content:start}
@media (max-width:560px){.type-grid{grid-template-columns:1fr}}
.type-g{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.inline-link{color:var(--accent);font-weight:700}
@media (max-width:420px){.tab{font-size:10.5px}.ti{width:44px}}

.step-h{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--accent-soft);margin-bottom:-6px}
.step-h span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;flex:none}

<script>
document.documentElement.lang = 'tr';

/* ================= İçerik ================= */
const WEEKS = [
  {n:'Fark Et', d:'Sözleri duymak', intro:'Sana söylenenleri yargılamadan duymayı öğreniyorsun.'},
  {n:'Anla', d:'Niyeti görmek', intro:'Her sözün altındaki asıl amaca bakıyorsun.'},
  {n:'Dönüştür', d:'Enerjini korumak', intro:'Fark ettiklerinle kendi alanını yeniden kuruyorsun.'}
];
const DAYS = [
 {w:1,t:'Duymak',focus:'Bugün sadece dinliyorum, yargılamadan.',task:'Bugün bana söylenen ve aklımda kalan cümle…'},
 {w:1,t:'Evde',focus:'Bugün evdeki sözlere kulak veriyorum.',task:'Evde sık duyduğum bir cümle…'},
 {w:1,t:'İşte, okulda',focus:'Bugün işte ya da okulda söylenenleri fark ediyorum.',task:'Beni büyüten ya da küçülten bir söz…'},
 {w:1,t:'Arkadaşlarla',focus:'Bugün sohbetlerin bende bıraktığına bakıyorum.',task:'Bir sohbetten sonra kendimi şöyle hissettim…'},
 {w:1,t:'Bedenim',focus:'Bugün sözlerin bedenimdeki izini fark ediyorum.',task:'Bir söz duyduğumda bedenimde…'},
 {w:1,t:'Ses tonu',focus:'Bugün sözler kadar söyleniş biçimine de dikkat ediyorum.',task:'Kelimeleri başka, tonu başka olan bir söz…'},
 {w:1,t:'Bir hafta',focus:'Bugün ilk haftama geri bakıyorum.',task:'Bu hafta en çok fark ettiğim…'},
 {w:2,t:'Niyet',focus:'Bugün sözlerin arkasındaki amacı görmeye çalışıyorum.',task:'Bugün duyduğum bir sözün asıl amacı belki de…'},
 {w:2,t:'Eleştiri ve endişe',focus:'Bugün eleştirinin altındaki duyguya bakıyorum.',task:'Eleştiri gibi duyduğum ama altında endişe olan bir söz…'},
 {w:2,t:'Övgü',focus:'Bugün övgülerin bende bıraktığına bakıyorum.',task:'Beni gerçekten iyi hissettiren bir övgü…'},
 {w:2,t:'Şaka',focus:'Bugün şakaların taşıdığı mesajı fark ediyorum.',task:'Güldüğüm ama içime dokunan bir söz…'},
 {w:2,t:'Sessizlik',focus:'Bugün söylenmeyenleri de duyuyorum.',task:'Duymak isteyip duyamadığım söz…'},
 {w:2,t:'Onun yerinden',focus:'Bugün söyleyenin yerinden bakmayı deniyorum.',task:'Bir sözün arkasındaki ihtiyaç belki de…'},
 {w:2,t:'İki hafta',focus:'Bugün ikinci haftama geri bakıyorum.',task:'Sözlerin niyetini görmek bende şunu değiştirdi…'},
 {w:3,t:'Beni besleyenler',focus:'Bugün kimin yanında dolduğumu fark ediyorum.',task:'Yanında kendimi iyi hissettiğim kişi ve nedeni…'},
 {w:3,t:'Sınırım',focus:'Bugün kendi sınırımı sakin bir cümleyle çiziyorum.',task:'Benim sınır cümlem…'},
 {w:3,t:'Bir nefes',focus:'Bugün cevap vermeden önce bir nefes alıyorum.',task:'Nefes alıp cevap verdiğimde…'},
 {w:3,t:'İç sesim',focus:'Bugün kendime söylediklerimi dinliyorum.',task:'Kendime sık söylediğim cümle…'},
 {w:3,t:'Güzel söz',focus:'Bugün iyi gelen bir sözü ben söylüyorum.',task:'Bugün birine şunu söyledim…'},
 {w:3,t:'Yakınlık',focus:'Bugün ilişkilerimdeki mesafeye bakıyorum.',task:'Daha yakın olmak istediğim kişi…'},
 {w:3,t:'Yeni bir kulak',focus:'Bugün 21 güne geri bakıyorum.',task:'21 gün önceki kendime…'}
];
const ENVS = [{id:'ev',l:'Ev & Aile'},{id:'arkadas',l:'Arkadaşlar'},{id:'is',l:'İş Yeri'},{id:'okul',l:'Okul'},{id:'diger',l:'Diğerleri'}];
const TYPES = [
 ['saygili','Yol gösterici eleştiri','Eleştiri'],['kirici','Kırıcı eleştiri','Eleştiri'],
 ['destekleyici','Destekleyici','Destek'],['igneleyici','İğneleyici','Destek'],['notr','Nötr','Nötr']];
const typeL = id => (TYPES.find(t=>t[0]===id)||[,''])[1];
const INTENTS = [
 ['destek','Destek olmak'],['takdir','Takdir etmek'],['koruma','Korumak / endişe'],['yonlendirme','Yönlendirmek'],
 ['kontrol','Kontrol etmek'],['elestiri','Eleştirmek / küçültmek'],['sucluluk','Suçluluk yaratmak'],['kiyas','Kıyaslamak'],
 ['korku','Kendi korkusunu yansıtmak'],['sinir','Sınır çizmek'],['saka','Şaka / hafiflik'],['ilgi','İlgi istemek'],['belirsiz','Emin değilim']
];
const BODY = [['gogus','Göğüste sıkışma'],['bogaz','Boğazda düğüm'],['omuz','Omuzlarda gerilim'],['mide','Midede ağırlık'],['hafif','Hafiflik'],['sicak','İçte sıcaklık'],['nefes','Rahat nefes'],['yok','Fark etmedim']];
const SCALE = [
 {v:-2,l:'Çok zorlayıcı',w:['Kırgın','Yorgun','Suçluymuş gibi','Değersiz','Öfkeli','Küçümsenmiş','Çaresiz','Utanmış','Yalnız','Kaygılı','Tükenmiş','Görülmemiş','Aşağılanmış','Kandırılmış','Korkmuş']},
 {v:-1,l:'Biraz zorlayıcı',w:['Gergin','Huzursuz','Kafası karışık','Hayal kırıklığına uğramış','Rahatsız','Tedirgin','Baskı altında','Biraz üzgün','Alınmış','Sıkılmış','Yetersiz','Anlaşılmamış','Sabırsız']},
 {v:0,l:'Nötr',w:['Sakin','Dengede','Etkilenmemiş','Kayıtsız','Düşünceli','Mesafeli','Meraklı','Şaşkın']},
 {v:1,l:'İyi',w:['Rahat','Anlaşılmış','Memnun','Huzurlu','Kabul görmüş','Umutlu','Desteklenmiş','Hafiflemiş','Güvende','İlgi görmüş','Sakinleşmiş']},
 {v:2,l:'Çok iyi',w:['Değerli','Sevilmiş','Mutlu','Güçlü','Minnettar','Coşkulu','Özgüvenli','Görülmüş','İlham almış','Neşeli','Takdir edilmiş','Huzur dolu','Gururlu']}
];
const ELBL = Object.fromEntries(SCALE.map(x=>[String(x.v),x.l]));
const feelLevel = w => { const x = SCALE.find(x=>x.w.includes(w)); return x ? x.v : null; };
const intentL = id => (INTENTS.find(i=>i[0]===id)||[,id])[1];
const bodyL = id => (BODY.find(i=>i[0]===id)||[,id])[1];
const envL = id => (ENVS.find(e=>e.id===id)||{l:id}).l;

/* ================= Durum ================= */
const KEY = 'yanki21.v1';
let mem = null;
function load(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return mem; }
function save(){ mem = S; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const blank = () => ({v:2,name:'',start:null,logs:[],refl:{},demo:false,intent:null});
let S = load() || blank();
if(!(S.v >= 2)){ S.logs.forEach(l=>{ l.energy = Math.max(-2, Math.min(2, l.energy)); l.feel = l.feel || []; delete l.body; }); S.v = 2; save(); }

/* ================= Yardımcılar ================= */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const dayDiff = (a,b) => Math.round((Date.UTC(...ymd(b)) - Date.UTC(...ymd(a)))/864e5);
function ymd(s){ const [y,m,d]=s.split('-').map(Number); return [y,m-1,d]; }
const today = () => iso(new Date());
function rawDay(){ return S.start ? dayDiff(S.start, today())+1 : 1; }
function curDay(){ return Math.min(21, Math.max(1, rawDay())); }
function dayDate(n){ const d = parseISO(S.start||today()); d.setDate(d.getDate()+n-1); return d; }
const fmtDate = (d,o={day:'numeric',month:'long',weekday:'long'}) => d.toLocaleDateString('tr-TR',o);
const fmtTime = ts => new Date(ts).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const sgn = v => v>0 ? '+'+v : v<0 ? '−'+Math.abs(v) : '0';
const sgnF = v => { const r = Math.round(v*10)/10; return r>0?'+'+r.toFixed(1).replace('.',','):r<0?'−'+Math.abs(r).toFixed(1).replace('.',','):'0'; };
const ecls = v => v>0?'e-pos':v<0?'e-neg':'e-neu';
function greeting(){ const h=new Date().getHours(); return h<5?'İyi geceler':h<11?'Günaydın':h<17?'İyi günler':h<22?'İyi akşamlar':'İyi geceler'; }
const isDone = n => !!(S.refl[n] && S.refl[n].done);

/* ================= Router ================= */
const main = document.getElementById('main');
const VIEWS = {anasayfa:renderHome, bugun:renderToday, yolculuk:renderJourney, analiz:renderInsights, rehber:renderGuide, ayarlar:renderSettings};
let view = 'anasayfa';
function route(){
  let v = location.hash.slice(1); if(!VIEWS[v]) v='anasayfa';
  const changed = v !== view; view = v;
  document.querySelectorAll('.tab').forEach(t => { if(t.dataset.tab===v) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current'); });
  render(changed);
}
function render(anim){
  setTimeout(()=>document.querySelectorAll('textarea.lined').forEach(autoGrow),0);
  homeAnim = !!anim; main.classList.toggle('wide', view==='anasayfa');
  main.innerHTML = VIEWS[view]();
  if(anim){ main.classList.remove('view-in'); void main.offsetWidth; main.classList.add('view-in'); window.scrollTo(0,0); }
  document.getElementById('fab').hidden = !S.start || view==='ayarlar' || view==='rehber' || view==='anasayfa' || view==='bugun';
}
window.addEventListener('hashchange', route);

/* ================= Parçalar ================= */
function demoBanner(){
  return S.demo ? `<div class="banner"><span><b>Örnek veriler gösteriliyor.</b> Kendi yolculuğuna başlamak için temizle.</span><button class="btn small" data-act="start-own">Kendi yolculuğumu başlat</button></div>` : '';
}
function orbitSVG(d){
  const R=82, c=100; let dots='';
  for(let i=1;i<=21;i++){
    const a = (-90 + (i-1)*360/21) * Math.PI/180, x = c+R*Math.cos(a), y = c+R*Math.sin(a);
    const cls = isDone(i)?'done': i===d?'now': i<d?'past':'';
    if(i===d) dots += `<circle class="o-halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"/>`;
    dots += `<circle class="o-dot ${cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i===d?6.5:5}"/>`;
  }
  return `<svg viewBox="0 0 200 200" role="img" aria-label="21 günün ${d}. günü, ${Object.values(S.refl).filter(r=>r.done).length} gün tamamlandı">
    <circle class="o-track" cx="100" cy="100" r="${R}"/>${dots}
    <text class="o-num" x="100" y="112" text-anchor="middle">${d}</text>
    <text class="o-sub" x="100" y="134" text-anchor="middle">GÜN / 21</text></svg>`;
}
function anNo(l){ return S.logs.filter(x=>x.day===l.day).sort((a,b)=>a.ts-b.ts).indexOf(l)+1; }
function logCard(l, showDay){
  const feels = (l.feel||[]).map(f=>`<span class="epill ${ecls(feelLevel(f)??l.energy)}">${esc(f)}</span>`).join('');
  const intents = (l.intent||[]).map(i=>`<span class="chip-sm">${esc(intentL(i))}</span>`).join('');
  return `<article class="log" tabindex="0" role="button" data-act="edit-log" data-id="${l.id}" aria-label="Anı düzenle">
    <div class="log-top"><span class="an-no">${showDay?`Gün ${l.day} · `:''}${anNo(l)}. An</span><span class="tag">${esc(envL(l.env))}</span>
      <span class="epill ${ecls(l.energy)}">${sgn(l.energy)} · ${ELBL[l.energy]}</span>
      <span class="time">${fmtTime(l.ts)}</span></div>
    ${l.person||l.type?`<p class="who-line">${l.person?`Kiminle: <b>${esc(l.person)}</b>`:''}${l.person&&l.type?' · ':''}${l.type?`Tür: <b>${typeL(l.type)}</b>`:''}</p>`:''}
    <blockquote class="quote">“${esc(l.text)}”</blockquote>
    ${feels?`<div class="chips-sm" aria-label="Hissettirdikleri">${feels}</div>`:''}
    ${intents?`<div class="chips-sm" aria-label="Asıl amaç">${intents}</div>`:''}
    ${l.meant?`<p class="resp"><b>Ne demek istemiş olabilir:</b> ${esc(l.meant)}</p>`:''}
    ${l.response?`<p class="resp"><b>Karşılığım:</b> ${esc(l.response)}</p>`:''}
  </article>`;
}
function emptyLogs(day){
  return `<div class="empty slim"><p>Seni etkileyen bir söz duyduğunda buraya yaz.</p><button class="btn primary small" data-act="add" data-day="${day}">An ekle</button></div>`;
}

/* ================= Bugün ================= */
const DQ = [['iyi','Bugün bana iyi gelen bir cümle…'],['fark','Bugün fark ettiğim…'],['ogren','Bugün öğrendiğim…'],['sukur','Bugün şükrettiğim, minnettar olduğum…']];
function renderToday(){
  if(!S.start) return '';
  const d = curDay(), raw = rawDay();
  const logs = S.logs.filter(l=>l.day===d).sort((a,b)=>a.ts-b.ts);
  return `${demoBanner()}
  ${raw>21?`<div class="banner"><span><b>21 günü tamamladın.</b> Tüm anların Analiz ekranında.</span><a class="btn small" href="#analiz">Analize git</a></div>`:''}
  ${dayBody(d, logs, true)}`;
}
function dayBody(d, logs, full){
  const D = DAYS[d-1], r = S.refl[d] || {}, q = r.q || {};
  const line = (k, ph, rows) => `<textarea class="lined" data-dk="${k}" data-day="${d}" rows="${rows||1}" aria-label="${ph}" placeholder="">${esc(k==='note'?(r.note||''):(q[k]||(k==='fark'&&r.text)||''))}</textarea>`;
  return `<article class="journal">
    ${full?`<header class="j-head"><p class="j-date">Gün ${d} · ${fmtDate(new Date(),{day:'numeric',month:'long',weekday:'long'})}</p>
      <h1 class="j-title">${D.t}</h1></header>`:''}
    <p class="j-intent">${D.focus}</p>

    <section class="j-sec">
      <div class="j-row"><h2 class="j-h">Bugün dene</h2>
        <button class="j-tick" data-act="task-done" data-day="${d}" aria-pressed="${!!r.taskDone}"><span class="box" aria-hidden="true"></span>${r.taskDone?'Yaptım':'Yaptım'}</button></div>
      <p class="j-prompt">${D.task}</p>
      ${line('note', D.task, 2)}
    </section>

    <section class="j-sec">
      <div class="j-row"><h2 class="j-h">Bugünün anları</h2><button class="j-add" data-act="add" data-day="${d}">+ An ekle</button></div>
      ${logs.length ? `<div class="logs j-logs">${logs.map(l=>logCard(l)).join('')}</div>` : `<p class="j-empty">Seni etkileyen bir söz duyduğunda buraya ekle.</p>`}
    </section>

    <section class="j-sec">
      <h2 class="j-h">Bugün kendimi…</h2>
      <div class="moods">${[2,1,0,-1,-2].map(v=>`<button type="button" class="mood dm" data-dm="${v}" data-day="${d}" aria-pressed="${r.mood===v}" aria-label="${sgn(v)} ${ELBL[v]}"><span class="dot" style="${eBtnStyle(v)}">${sgn(v)}</span><small>${ELBL[v]}</small></button>`).join('')}</div>
      ${logs.length?`<p class="j-note">Anlarının ortalaması ${sgnF(avg(logs.map(l=>l.energy)))}</p>`:''}
    </section>

    ${d===21 && hasIntent() ? intentCard(true) : ''}
    <section class="j-sec">
      <h2 class="j-h">Akşam</h2>
      ${DQ.map(([k,l])=>`<div class="j-q"><p class="j-prompt">${l}</p>${line(k,l,1)}</div>`).join('')}
    </section>

    <footer class="j-foot">${r.done?`<span class="done-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5 9-10"/></svg>Bu sayfa tamamlandı</span>`:`<span class="j-note">Yazdıkların kendiliğinden kaydedilir.</span><button class="btn primary" data-act="complete-day" data-day="${d}">Günü tamamla</button>`}</footer>
  </article>`;
}

/* ================= Yolculuk ================= */
function renderJourney(){
  const d = curDay();
  const doneN = Object.values(S.refl).filter(r=>r.done).length;
  let html = `${demoBanner()}<header><p class="eyebrow">${doneN} / 21 gün tamamlandı</p><h1 class="page-title">Yolculuk</h1>
    <p class="page-intro">Üç hafta, üç adım: önce sözleri duy, sonra niyetlerini anla, en sonunda enerjini koru. Bir güne dokunarak içeriğini ve kayıtlarını aç.</p></header>`;
  WEEKS.forEach((W,wi)=>{
    const days = DAYS.map((D,i)=>({...D,n:i+1})).filter(D=>D.w===wi+1);
    const wd = days.filter(D=>isDone(D.n)).length;
    html += `<section class="week"><div class="week-head"><div><p class="eyebrow">${wi+1}. Hafta · ${W.d}</p><h3>${W.n}</h3></div><span class="wprog">${wd}/7</span></div>
      <div class="days">${days.map(D=>{
        const st = isDone(D.n)?'done': D.n===d?'now': D.n>d?'locked':'past';
        const lbl = {done:'✓ Tamam',now:'Bugün',locked:fmtDate(dayDate(D.n),{day:'numeric',month:'short'}),past:'Açık'}[st];
        const cnt = S.logs.filter(l=>l.day===D.n).length;
        return `<button class="day ${st}" data-act="open-day" data-day="${D.n}"><span class="ds">${lbl}</span><span class="dn">${D.n}</span><span class="dt">${D.t}</span>${cnt?`<span class="muted" style="font-size:12px">${cnt} an</span>`:''}</button>`;
      }).join('')}</div></section>`;
  });
  return html;
}
function openDay(n){
  const D = DAYS[n-1], d = curDay(), locked = n>d;
  const logs = S.logs.filter(l=>l.day===n).sort((a,b)=>a.ts-b.ts);
  openSheet(`<div class="sheet-head"><div><p class="eyebrow">Gün ${n}</p><h2>${D.t}</h2></div>${closeBtn()}</div>
    <div class="day-sheet">
    ${locked ? `<p class="locked-note">Bu gün ${fmtDate(dayDate(n),{day:'numeric',month:'long',weekday:'long'})} açılacak.</p>` : `${dayBody(n, logs, false)}`}
    </div>`);
}

/* ================= Analiz ================= */
function renderInsights(){
  const L = S.logs;
  const head = `${demoBanner()}<header><p class="eyebrow">Anların ve hislerin</p><h1 class="page-title">Analiz</h1>
    <p class="page-intro">Yazdığın anlar hangi ortamdan geliyor, sana ne hissettiriyor ve altında hangi niyet yatıyor?</p></header>`;
  if(!L.length) return head + `<div class="empty"><p class="display">Haritan ilk anla başlar.</p><p>Birkaç an yazdıktan sonra ortamlara, kişilere ve hislere göre dengen burada görünecek.</p><button class="btn primary" data-act="add">An ekle</button></div>`;
  const all = avg(L.map(l=>l.energy));
  const pos = L.filter(l=>l.energy>0).length, neg = L.filter(l=>l.energy<0).length;
  const doneN = Object.values(S.refl).filter(r=>r.done).length;
  const envs = ENVS.map(e=>{ const ls=L.filter(l=>l.env===e.id); return {...e,n:ls.length,a:avg(ls.map(l=>l.energy)),p:ls.filter(l=>l.energy>0).length,ng:ls.filter(l=>l.energy<0).length}; });
  const used = envs.filter(e=>e.n);
  const best = [...used].sort((a,b)=>b.a-a.a)[0], worst = [...used].sort((a,b)=>a.a-b.a)[0];
  let line = '';
  if(used.length>1 && best.a!==worst.a) line = `Sana en iyi gelen ortam <span class="p">${best.l} (${sgnF(best.a)})</span>, en zorlayıcı ortam <span class="n">${worst.l} (${sgnF(worst.a)})</span>.`;
  else line = `Şu ana kadar anlarının çoğu <span class="${best.a>=0?'p':'n'}">${best.l}</span> ortamından geliyor; ortalama etkisi ${sgnF(best.a)}.`;

  const envRows = used.map(e=>{
    const w = Math.abs(e.a)/2*50;
    return `<div><div class="env-row"><div class="el">${e.l}<small>${e.n} an</small></div>
      <div class="div-track" role="img" aria-label="${e.l} ortalama enerji ${sgnF(e.a)}"><i class="div-bar ${e.a>=0?'pos':'neg'}" style="width:${w}%"></i></div>
      <div class="ev" style="color:var(${e.a>0?'--pos-ink':e.a<0?'--neg-ink':'--muted'})">${sgnF(e.a)}</div></div>
      <div class="env-row" style="margin-top:0"><span></span><div class="split" style="grid-column:auto;margin-top:0" title="İyi ${e.p}, nötr ${e.n-e.p-e.ng}, zorlayıcı ${e.ng}"><i class="sp" style="width:${e.p/e.n*100}%"></i><i class="s0" style="width:${(e.n-e.p-e.ng)/e.n*100}%"></i><i class="sn" style="width:${e.ng/e.n*100}%"></i></div><span></span></div></div>`;
  }).join('');

  const d = curDay();
  let cols='', xs='';
  for(let i=1;i<=21;i++){
    const ls = L.filter(l=>l.day===i), a = avg(ls.map(l=>l.energy)), h = Math.abs(a)/2*50;
    cols += `<div class="fcol ${i===d?'cur':''}" title="Gün ${i}: ${ls.length?sgnF(a)+' ('+ls.length+' an)':'kayıt yok'}">${ls.length&&a!==0?`<i class="${a>0?'p':'n'}" style="height:${Math.max(h,3)}%"></i>`:''}${ls.length&&a===0?`<i class="p" style="height:1.5%;background:var(--muted)"></i>`:''}</div>`;
    xs += `<span style="${i===d?'color:var(--ink);font-weight:700':''}">${i}</span>`;
  }

  const ic = INTENTS.map(([id,l])=>{ const ls=L.filter(x=>(x.intent||[]).includes(id)); return {l,n:ls.length,a:avg(ls.map(x=>x.energy))}; }).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const imax = ic.length ? ic[0].n : 1;
  const intentRows = ic.length ? ic.map(x=>`<div class="hbar"><span class="t">${x.l}</span><span class="b"><i style="width:${x.n/imax*100}%;background:var(${x.a>0?'--pos':x.a<0?'--neg':'--muted'})"></i></span><span class="c">${x.n}</span></div>`).join('')
    : '<p class="muted">Anlarında asıl amacı seçtiğinde burada görünecek.</p>';

  const pm = {};
  L.filter(l=>l.person&&l.person.trim()).forEach(l=>{ const k=l.person.trim().toLocaleLowerCase('tr-TR'); (pm[k]=pm[k]||{name:l.person.trim(),e:[],env:l.env}).e.push(l.energy); });
  const people = Object.values(pm).map(p=>({...p,n:p.e.length,a:avg(p.e)})).sort((a,b)=>b.n-a.n||b.a-a.a).slice(0,8);
  const peopleHtml = people.length ? people.map(p=>`<div class="person"><span class="av ${ecls(Math.round(p.a))}">${esc(p.name.charAt(0).toLocaleUpperCase('tr-TR'))}</span><span class="nm">${esc(p.name)}<small>${envL(p.env)} · ${p.n} an</small></span><span class="epill ${ecls(p.a)}">${sgnF(p.a)}</span></div>`).join('')
    : '<p class="muted">"Kiminle?" alanını doldurduğunda kişiler burada listelenir.</p>';

  const fc = {}; L.forEach(l=>(l.feel||[]).forEach(f=>{ fc[f]=(fc[f]||0)+1; }));
  const ft = Object.entries(fc).sort((a,b)=>b[1]-a[1]).slice(0,16);
  const tc = TYPES.map(([id,l])=>{ const ls=L.filter(x=>x.type===id); return {l,n:ls.length,a:avg(ls.map(x=>x.energy))}; });
  const tmax = Math.max(1,...tc.map(t=>t.n));
  const typeHtml = tc.some(t=>t.n) ? `<div class="hbars">${tc.map(t=>`<div class="hbar"><span class="t">${t.l}</span><span class="b"><i style="width:${t.n/tmax*100}%;background:var(${t.a>0?'--pos':t.a<0?'--neg':'--muted'})"></i></span><span class="c">${t.n}</span></div><div class="hbar" style="margin-top:-6px"><span></span><span class="muted" style="font-size:12px">${t.n?'Ortalama etki '+sgnF(t.a):'Henüz yok'}</span><span></span></div>`).join('')}</div>`
    : '<p class="muted">Anlarında "Bu söz ne türdeydi?" sorusunu cevapladığında burada görünecek.</p>';
  const feelHtml = ft.length ? `<div class="chips-sm feel-cloud">${ft.map(([f,c])=>`<span class="epill ${ecls(feelLevel(f)??0)}" style="font-size:${Math.min(17,12+c*1.3)}px">${esc(f)} <b>${c}</b></span>`).join('')}</div>`
    : '<p class="muted">Anlarında his kelimeleri seçtiğinde burada görünecek.</p>';
  return head + `
  <section class="stats">
    <div class="stat"><span class="v">${L.length}</span><span class="k">Yazılan an</span></div>
    <div class="stat"><span class="v" style="color:var(${all>0?'--pos-ink':all<0?'--neg-ink':'--ink'})">${sgnF(all)}</span><span class="k">Ortalama his (−2/+2)</span></div>
    <div class="stat"><span class="v">${Math.round(pos/L.length*100)}<small style="font-size:20px">%</small></span><span class="k">İyi gelen anlar</span></div>
    <div class="stat"><span class="v">${doneN}<small style="font-size:20px">/21</small></span><span class="k">Tamamlanan gün</span></div>
  </section>
  <section class="block"><p class="label">Öne çıkan</p><p class="insight-line">${line}</p>
    <p class="muted" style="font-size:13.5px">Toplam ${pos} iyi gelen, ${L.length-pos-neg} nötr ve ${neg} zorlayıcı an yazdın.</p></section>
  <section class="block"><div class="sec-head"><h3>Ortamlara göre his dengesi</h3></div>
    <div class="env-rows">${envRows}</div>
    <div class="env-row"><span></span><div class="axis"><span>−2 zorlayıcı</span><span>0</span><span>+2 çok iyi</span></div><span></span></div>
    <div class="legend"><span><i style="background:var(--pos)"></i>İyi</span><span><i style="background:var(--line)"></i>Nötr</span><span><i style="background:var(--neg)"></i>Zorlayıcı</span></div>
  </section>
  <section class="block"><div class="sec-head"><h3>21 günlük his akışı</h3></div>
    <p class="muted" style="font-size:13.5px">Her sütun o günün ortalaması. Çizginin üstü iyi gelen, altı zorlayıcı.</p>
    <div class="flow"><div class="flow-in">${cols}</div><div class="flow-x">${xs}</div></div>
  </section>
  <section class="block"><div class="sec-head"><h3>Söz türleri</h3></div><p class="muted" style="font-size:13px">Duyduğun sözlerin türü ve sende bıraktığı ortalama etki.</p>${typeHtml}</section>
  <section class="block"><div class="sec-head"><h3>En sık hissettiklerin</h3></div>
    ${feelHtml}</section>
  <section class="grid2">
    <div class="block"><h3 class="display" style="font-size:24px">Niyet haritası</h3><p class="muted" style="font-size:13px">Anların altında en sık gördüğün amaçlar. Renk, o niyetin ortalama etkisini gösterir.</p><div class="hbars">${intentRows}</div></div>
    <div class="block"><h3 class="display" style="font-size:24px">Kişiler</h3><p class="muted" style="font-size:13px">En sık an yaşadığın kişiler ve ortalama etkileri.</p><div class="people">${peopleHtml}</div></div>
  </section>`;
}

function submitIntent(f){

function renderHome(){

    <div class="home-top">${welcomeHTML()}</div>

      <div class="about-b" style="gap:12px">
      ${editing ? `<p class="muted">Yolculuğa başlamadan önce birkaç dakikanı ayır ve niyetini yaz. 21. günde buraya geri döneceksin ve ne kadar yol aldığını göreceksin.</p>${intentFormHTML()}` : intentCard(true, true)+'<div><button class="btn small" data-act="edit-intent">Düzenle</button></div>'}

function intentCard(full, home){
  const I = S.intent;
  if(!I || !(I.why||I.notice||I.promise)) return `<button class="intent-empty" data-act="edit-intent"><b>Başlangıç niyetini yaz</b><span>Bu günlüğü neden tuttuğunu ve 21 gün sonra neyi fark etmek istediğini yaz.</span></button>`;
  const rows = [['Neden başladım', I.why],['21 gün sonra fark etmek istediğim', I.notice],['Kendime sözüm', I.promise]].filter(r=>r[1]);
  const foc = (I.focus||[]).map(envL).join(', ');
  return `<section class="intent-card">
    ${home?'':`<div class="sec-head"><p class="label">${full?'21 gün önce yazdıkların':'Başlangıç niyetin'}</p><button class="link" data-act="edit-intent">${full?'Gör / düzenle':'Düzenle'}</button></div>`}
    ${full ? rows.map(r=>`<div><p class="intent-k">${r[0]}</p><blockquote class="intent-q">“${esc(r[1])}”</blockquote></div>`).join('')
      + (foc?`<p class="intent-k">Odaklandığın ortamlar: <b>${esc(foc)}</b></p>`:'')
      + (I.mood!==null&&I.mood!==undefined?`<p class="intent-k">Başlarken genel hissin: <span class="epill ${ecls(I.mood)}">${sgn(I.mood)} · ${ELBL[I.mood]}</span></p>`:'')
      : `<blockquote class="intent-q">“${esc(I.promise||I.notice||I.why)}”</blockquote>`}
  </section>`;
}

function renderGuide(inSheet){
  const sc = [

function openSheet(html){
  setTimeout(()=>document.querySelectorAll('.sheet textarea.lined').forEach(autoGrow),0);
  lastFocus = document.activeElement;
  sheetRoot.innerHTML = `<div class="sheet-wrap" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  document.body.style.overflow='hidden';

function submitLog(form){
  const text = form.querySelector('#f-text').value.trim();
  const eb = form.querySelector('.eb[aria-pressed="true"]');
  const err = form.querySelector('#f-err');
  if(!text){ err.textContent='Ne olduğunu ya da ne söylendiğini yaz.'; form.querySelector('#f-text').focus(); return; }
  if(!eb){ err.textContent='Bu anın sana ne hissettirdiğini −2 ile +2 arasında seç.'; form.querySelector('.eb').focus(); return; }
  const pick = g => [...form.querySelectorAll(`[data-group="${g}"] [aria-pressed="true"]`)].map(b=>b.dataset.chip);
  const extra = form.querySelector('#f-feel').value.split(',').map(x=>x.trim()).filter(Boolean);
  const id = form.dataset.id;
  const rec = { type: pick('type')[0]||'', env: pick('env')[0]||'diger', person: form.querySelector('#f-person').value.trim(), text, intent: pick('intent'), energy: Number(eb.dataset.e), feel: [...new Set([...pick('feel'), ...extra])], response: form.querySelector('#f-resp').value.trim(), meant: form.querySelector('#f-meant').value.trim() };
  if(id){ Object.assign(S.logs.find(x=>x.id===id), rec); }
  else S.logs.push({id:uid(), day:Number(form.dataset.day), date:today(), ts:Date.now(), ...rec});
  save(); closeSheet(); render(false); toast(id?'An güncellendi':'An kaydedildi');
}

/* ================= Olaylar ================= */
document.addEventListener('click', e=>{
  const chip = e.target.closest('[data-chip]');
  if(chip && chip.parentElement.dataset.group==='type'){ const was = chip.getAttribute('aria-pressed')==='true';
    chip.closest('form').querySelectorAll('[data-group="type"] [data-chip]').forEach(c=>c.setAttribute('aria-pressed','false'));
    chip.setAttribute('aria-pressed', String(!was)); return; }
  if(chip){ const g = chip.parentElement; if(g.dataset.multi!=='1') g.querySelectorAll('[data-chip]').forEach(c=>c.setAttribute('aria-pressed','false'));
    chip.setAttribute('aria-pressed', g.dataset.multi==='1' ? String(chip.getAttribute('aria-pressed')!=='true') : 'true'); return; }
  const mb = e.target.closest('.mb');
  if(mb){ const was = mb.getAttribute('aria-pressed')==='true'; mb.parentElement.querySelectorAll('.mb').forEach(b=>b.setAttribute('aria-pressed','false')); mb.setAttribute('aria-pressed', String(!was)); return; }
  const dm = e.target.closest('.dm');
  if(dm){ const n = Number(dm.dataset.day), v = Number(dm.dataset.dm), r = S.refl[n] = S.refl[n] || {};
    r.mood = r.mood===v ? null : v; save();
    dm.parentElement.querySelectorAll('.dm').forEach(b=>b.setAttribute('aria-pressed', String(Number(b.dataset.dm)===r.mood))); return; }
  const eb = e.target.closest('.eb:not(.mb):not(.dm)');
  if(eb){ eb.parentElement.querySelectorAll('.eb').forEach(b=>b.setAttribute('aria-pressed','false')); eb.setAttribute('aria-pressed','true');
    const box = document.getElementById('feelBox'); const keep = [...box.querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.chip);
    box.innerHTML = feelChips(Number(eb.dataset.e), keep); return; }
  const t = e.target.closest('[data-act]'); if(!t) return;
  const act = t.dataset.act;
  if(act==='backdrop'){ if(e.target===t) closeSheet(); return; }
  e.preventDefault();
  const A = {
    'add': ()=>openLogForm(null, t.dataset.day?Number(t.dataset.day):null),
    'edit-log': ()=>openLogForm(t.dataset.id),
    'open-day': ()=>openDay(Number(t.dataset.day)),
    'close-sheet': closeSheet,
    'to-intent': ()=>{ const h=document.getElementById('homeIntent'); if(h){ h.open=true; h.scrollIntoView({behavior:'smooth',block:'start'}); } },
    'full-guide': ()=>openSheet(`<div class="sheet-head"><div><p class="eyebrow">Rehber</p></div>${closeBtn()}</div><div style="display:flex;flex-direction:column;gap:22px">${renderGuide(true)}</div>`),
    'edit-intent': ()=>{ closeSheet(); intentEdit=true; if(view==='anasayfa'){ render(false); document.getElementById('intForm')?.scrollIntoView({block:'start'}); } else location.hash='#anasayfa'; },
    'intent-cancel': ()=>{ intentEdit=false; render(false); },
    'close-sheet-guide': ()=>{ closeSheet(); location.hash='#rehber'; },
    'guide-done': ()=>{ if(t.closest('.sheet')) closeSheet(); else location.hash='#bugun'; },
    'del-ask': ()=>{ document.getElementById('delZone').innerHTML = `<span class="err">Silinsin mi?</span><button type="button" class="btn danger small" data-act="del-yes">Evet</button><button type="button" class="btn ghost small" data-act="del-no">Hayır</button>`; },
    'del-no': ()=>{ document.getElementById('delZone').innerHTML = '<button type="button" class="btn danger" data-act="del-ask">Sil</button>'; },
    'del-yes': ()=>{ const id = document.getElementById('logForm').dataset.id; S.logs = S.logs.filter(x=>x.id!==id); save(); closeSheet(); render(false); toast('Kayıt silindi'); },
    'complete-day': ()=>{ const n = Number(t.dataset.day), r = S.refl[n] || {};
      const any = r.note || r.mood!==undefined && r.mood!==null || Object.values(r.q||{}).some(Boolean) || S.logs.some(l=>l.day===n);
      if(!any){ toast('Önce bir şey yaz ya da hissini seç'); return; }
      S.refl[n] = Object.assign({}, r, {done:true, ts:Date.now()}); save();
      if(t.closest('.sheet')) closeSheet(); render(false);
      toast(n===21?'Tebrikler, 21 günü tamamladın':'Gün '+n+' tamamlandı'); },
    'task-done': ()=>{ const n = Number(t.dataset.day); const r = S.refl[n] = S.refl[n] || {}; r.taskDone = !r.taskDone; save();
      t.setAttribute('aria-pressed', String(r.taskDone));  },
    'save-profile': ()=>{ S.name = document.getElementById('set-name').value.trim(); const st = document.getElementById('set-start').value; if(st) S.start = st; save(); render(false); toast('Ayarlar kaydedildi'); },
    'copy-backup': ()=>{ const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
      const out = document.getElementById('backupOut');
      const show = () => { out.innerHTML = `<p class="muted" style="font-size:13px;margin-bottom:6px">Kodu seçip kopyala ve güvenli bir yere kaydet:</p><code class="backup">${code}</code>`; };
      try{ navigator.clipboard.writeText(code).then(()=>toast('Yedek kodu kopyalandı'), show); }catch(_){ show(); } },
    'import-backup': ()=>{ const v = document.getElementById('imp').value.trim(), m = document.getElementById('impMsg');
      try{ const o = JSON.parse(decodeURIComponent(escape(atob(v)))); if(!o || !Array.isArray(o.logs)) throw 0; S = Object.assign(blank(), o); save(); render(false); toast('Yedek geri yüklendi'); }
      catch(_){ m.textContent = 'Bu kod okunamadı. Kodun tamamını kopyaladığından emin ol.'; } },
    'reset-ask': ()=>{ resetAsk=true; render(false); },
    'reset-no': ()=>{ resetAsk=false; render(false); },
    'reset-yes': ()=>{ resetAsk=false; S = blank(); save(); location.hash='#anasayfa'; showOnboarding(); render(false); },
    'start-own': ()=>{ const name = S.name; S = blank(); S.name = name==='Ayşe'?'':name; save(); showOnboarding(); render(false); },
  };
  A[act] && A[act]();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && sheetRoot.innerHTML) closeSheet();
  if((e.key==='Enter'||e.key===' ') && e.target.matches('.log[data-act]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e=>{ if(e.target.id==='logForm'){ e.preventDefault(); submitLog(e.target); } if(e.target.id==='intForm'){ e.preventDefault(); submitIntent(e.target); } });
let rt;
function autoGrow(el){ el.style.height='auto'; el.style.height=Math.max(el.scrollHeight, el.rows*32)+'px'; }
document.addEventListener('input', e=>{
  const dk = e.target.dataset && e.target.dataset.dk;
  if(dk){ const n = Number(e.target.dataset.day), r = S.refl[n] = S.refl[n] || {};
    if(dk==='note') r.note = e.target.value; else { r.q = r.q || {}; r.q[dk] = e.target.value; }
    clearTimeout(rt); rt = setTimeout(save, 300);
    if(e.target.classList.contains('lined')) autoGrow(e.target); }
  if(e.target.id==='f-text' || e.target.closest && e.target.closest('#logForm')){ const er=document.getElementById('f-err'); if(er) er.textContent=''; }
});

/* ================= Toast ================= */
let tt;
function toast(msg){ const r = document.getElementById('toastRoot'); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(tt); tt = setTimeout(()=>r.innerHTML='', 2400); }

/* ================= Karşılama ================= */
const onbRoot = document.getElementById('onbRoot');
const MOTTO = 'Her sabah yeni bir gün, her gün yeni anlar. | Kendime ve sevdiklerime doğru küçük bir yolculuk.';

}

  return `    <section class="onb-hero">
      <p class="onb-bless">Anda kal · Gözlem yap · Teşekkür et</p>
      <h1 class="onb-brand">Yankı <i>21</i></h1>

    <details class="onb-guide about"><summary><span><span class="eyebrow">Başlamadan önce oku</span><b>Uygulama hakkında</b></span><span class="pl" aria-hidden="true"></span></summary><div class="about-b">
      ${acc(1,'Yankı 21 nedir?',`<p>21 gün boyunca duyduğun sözleri fark et, asıl amacını gör ve sende nasıl bir etki bıraktığını anla.</p><p>Amaç, sözün asıl amacını görmek ve sende olumlu mu olumsuz mu bir etki bıraktığını fark etmektir.</p>`, true)}
      ${acc(2,'21 gün nasıl ilerler?',`<p>Her gün ve her anda şu üç adım sırayla tekrar eder:</p>
        <ol><li><b>Fark Et:</b> Yargılamadan ne olduğunu gözlemle. Ne söylendi, sende nasıl bir yankı bıraktı?</li><li><b>Anla:</b> Sözün arkasına bak. Karşındaki ne demek istemiş olabilir?</li><li><b>Dönüştür:</b> Bu farkındalıkla nasıl karşılık vermek istediğini seç.</li></ol>`)}
      ${acc(3,'Bir “An” nasıl yazılır?',`<p>Gün içinde seni etkileyen her söz bir andır. Her an üç adımda yazılır:</p>
        <p class="g-sub" style="margin-top:4px">Fark Et</p><ol><li>Nerede? <span class="muted">Ev & Aile, Arkadaşlar, İş Yeri, Okul, Diğerleri</span></li><li>Kiminle?</li><li>Ne oldu, ne söyledi? <span class="muted">Yargılamadan, olduğu gibi</span></li><li>Bana ne hissettirdi? <span class="muted">−2 ile +2 arası ve his kelimeleri</span></li></ol>
        <p class="g-sub">Anla</p><ol start="5"><li>Bu söz ne türdeydi?</li><li>Sence asıl amacı neydi?</li><li>Karşımdaki insan ne demek istemiş olabilir?</li></ol>
        <p class="g-sub">Dönüştür</p><ol start="8"><li>Nasıl karşılık verdim ya da vermek isterdim?</li></ol>`)}
      ${acc(4,'Sözleri nasıl değerlendiririm?',matrixHTML())}
      ${acc(5,'Etki ölçeği: −2’den +2’ye',`<p>Kendine sor: “Bu söz bende nasıl bir etki bıraktı?”</p><div class="mini-sc">${scale}</div>`)}
      ${acc(6,'Gizlilik',`<p>Yazdıkların yalnızca kendi cihazında saklanır. Hiçbir sunucuya gönderilmez, kimse göremez.</p>`)}
      <button class="btn" type="button" data-act="full-guide">Rehberin tamamını oku</button>
    </div></details>`;
}
function showOnboarding(){
  onbRoot.innerHTML = `<div class="onb"><div class="onb-grid">
${welcomeHTML()}

    <form id="onbForm" class="onb-form" novalidate>
      <div class="field"><label for="onb-name">Adın</label><input type="text" id="onb-name" placeholder="Sana nasıl seslenelim?" autocomplete="given-name" value="${esc(S.name||'')}"></div>
      <div class="row"><button class="btn primary" type="submit">Yolculuğa bugün başla</button><button class="btn ghost" type="button" id="onbDemo">Örnek verilerle incele</button></div>
      <p class="muted" style="font-size:13px">Kayıtların yalnızca bu cihazda saklanır.</p>
    </form>
  </div></div>`;
  document.getElementById('fab').hidden = true;
  const onb = onbRoot.querySelector('.onb');
  const go = () => onb.classList.add('go');
  if(window.__introDone || !document.getElementById('intro')) go(); else document.addEventListener('introdone', go, {once:true});
  document.getElementById('onbForm').addEventListener('submit', ev=>{ ev.preventDefault();
    S = blank(); S.name = document.getElementById('onb-name').value.trim(); S.start = today(); save(); onbRoot.innerHTML=''; location.hash='#anasayfa'; route(); render(true); toast('Hoş geldin · Başlangıç soruları sayfanın altında'); });
  document.getElementById('onbDemo').addEventListener('click', ()=>{ loadDemo(); onbRoot.innerHTML=''; location.hash='#anasayfa'; route(); render(true); });
}

    [6,'is','Yöneticim','“Bunu yarına yetiştirebilir misin? Biliyorum yoğunsun.” dedi.',['yonlendirme','destek'],0,['Düşünceli'],'Perşembeye kadar sürer dedim.','notr'],

/* ================= Açılış animasyonu ================= */
(function(){
  const intro = document.getElementById('intro'), orb = document.getElementById('introOrbit');
  if(!intro) return;
  const R = 46; // yüzde
  for(let i=0;i<21;i++){
    const a = (-90 + i*360/21)*Math.PI/180, s = document.createElement('i');
    s.className = 'odot' + (i===0?' gold':'');
    s.style.setProperty('--x', (Math.cos(a)*R*orb.offsetWidth/100 || 0)+'px');
    s.style.setProperty('--y', (Math.sin(a)*R*orb.offsetHeight/100 || 0)+'px');
    s.style.animationDelay = (0.15 + i*0.045)+'s';
    orb.appendChild(s);
  }
  let gone = false;
  const done = () => { if(gone) return; gone = true; window.__introDone = true; document.dispatchEvent(new Event('introdone')); intro.classList.add('out'); setTimeout(()=>intro.remove(), 1100); };
  intro.addEventListener('click', done);
  document.addEventListener('keydown', function k(e){ if(!gone && (e.key==='Escape'||e.key==='Enter')){ done(); document.removeEventListener('keydown',k); } });
  setTimeout(done, matchMedia('(prefers-reduced-motion: reduce)').matches ? 1800 : 4200);
})();

/* ================= Başlat ================= */
if(!S.start) showOnboarding();
route(); render(true);
